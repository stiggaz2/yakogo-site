<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="figmaViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#581c87" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Pure Figma Component Rhombus / 4 Diamonds Symbol 1-in-1 identical to default favicon -->
  <g fill="url(#figmaViolet)" filter="url(#subtleGlow)">
    <!-- Top diamond -->
    <polygon points="32,4 45.5,17.5 32,31 18.5,17.5"/>
    <!-- Bottom diamond -->
    <polygon points="32,33 45.5,46.5 32,60 18.5,46.5"/>
    <!-- Left diamond -->
    <polygon points="17.5,18.5 31,32 17.5,45.5 4,32"/>
    <!-- Right diamond -->
    <polygon points="46.5,18.5 60,32 46.5,45.5 33,32"/>
  </g>
  <!-- Notification Badge (Figma Comment / Unread Ping) -->
  <circle cx="51" cy="13" r="8.5" fill="url(#badgeGrad)" stroke="#08090d" stroke-width="2"/>
  <circle cx="51" cy="13" r="2.5" fill="#ffffff"/>
</svg>
